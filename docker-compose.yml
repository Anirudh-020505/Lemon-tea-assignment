version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount the local backend folder for hot-reloading (if overriding command)
      - ./backend:/app
      # Create a persistent volume for FlashRank cache so it doesn't download models on every restart
      - flashrank_data:/app/flashrank_cache
      # Persist uploaded files
      - uploads_data:/app/data/uploads
    env_file:
      - ./backend/.env
    environment:
      # If you want to enable hot-reloading in docker
      # - WATCHFILES_FORCE_POLLING=true
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  flashrank_data:
  uploads_data:
